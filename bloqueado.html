<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Restringido</title>
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
        }

        .shield-wrapper {
            width: 80px;
            height: 80px;
            background-color: #f2faf5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon {
            width: 40px;
            height: 40px;
            color: #67c23a;
            /* El verde característico de AdGuard */
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1d1d1f;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #606266;
            margin-bottom: 0;
        }

        .status-badge {
            display: inline-block;
            margin-top: 32px;
            padding: 6px 16px;
            background-color: #67c23a;
            color: white;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="shield-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                </path>
            </svg>
        </div>

        <h1>Acceso Denegado</h1>
        <p>Este sitio web ha sido interceptado y bloqueado por las políticas de seguridad del firewall de red.</p>

        <div class="status-badge">Conexión Protegida</div>
    </div>
</body>

</html>
