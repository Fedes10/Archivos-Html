<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #unlock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; background: rgba(0,0,0,0.1); cursor: pointer;
            color: white; font-family: sans-serif; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="unlock">Haga clic en cualquier lugar para iniciar la experiencia</div>
    
    <video id="rick" loop playsinline>
        <source src="https://raw.githubusercontent.com/Fedes10/Archivos-Html/main/fedexd.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById('rick');
        const u = document.getElementById('unlock');

        u.addEventListener('click', () => {
            v.muted = false;
            v.play();
            u.style.display = 'none';
        });
    </script>
</body>
</html>
