<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fede</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        /* Botón invisible gigante para forzar la interacción si Firefox bloquea */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; cursor: pointer; background: rgba(0,0,0,0);
        }
    </style>
</head>
<body>

    <div id="overlay"></div>
    <video id="rickvideo" loop playsinline>
        <source src="https://raw.githubusercontent.com/Fedes10/Archivos-Html/main/fedexd.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById('rickvideo');
        const overlay = document.getElementById('overlay');

        // Función para activar todo
        function startEverything() {
            v.muted = false;
            v.volume = 1.0;
            v.play();
            overlay.style.display = 'none'; // Quitamos el protector
        }

        // 1. Intento automático (suele fallar con audio en Firefox)
        window.addEventListener('load', () => {
            v.play().catch(() => {
                console.log("Firefox bloqueó el audio. Esperando clic.");
            });
        });

        // 2. Al hacer clic en cualquier parte de la web, se activa el sonido
        overlay.addEventListener('click', startEverything);
    </script>
</body>
</html>
