<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #unlock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; background: transparent; cursor: pointer;
            color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #unlock:hover {
            opacity: 1;
        }
        .play-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            pointer-events: none;
        }
    </style>
</head>
<body>
    
    <video id="rick" loop playsinline preload="auto">
        <source src="https://raw.githubusercontent.com/Fedes10/Archivos-Html/main/fedexd.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById('rick');
        const u = document.getElementById('unlock');

        // Intenta reproducción con sonido desde el inicio
        v.muted = false;
        const playPromise = v.play();

        if (playPromise !== undefined) {
            playPromise.then(() => {
                // Si el navegador permite autoplay con audio, oculta la capa
                u.style.display = 'none';
            }).catch(() => {
                // Si el navegador lo bloquea, se inicia sin sonido hasta la interacción
                v.muted = true;
                v.play();
            });
        }

        u.addEventListener('click', () => {
            v.muted = false;
            v.currentTime = 0;
            v.play();
            u.style.display = 'none';
        });
    </script>
</body>
</html>
